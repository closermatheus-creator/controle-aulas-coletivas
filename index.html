<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AquaControl mudou de endereço</title>
<meta http-equiv="refresh" content="5; url=https://app.iaparhub.com.br/">
<meta name="robots" content="noindex">
<style>
  :root { --azul:#0a5cff; --azul2:#0047d6; --fundo:#f2f5fb; --texto:#071a3d; --cinza:#5b6785; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px;
         background:var(--fundo); color:var(--texto); font-family:Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
  .caixa { max-width:440px; width:100%; background:#fff; border-radius:12px; padding:32px 26px;
           box-shadow:0 8px 30px rgba(7,26,61,.08); text-align:center; }
  h1 { font-size:20px; margin:0 0 10px; }
  p { font-size:14px; line-height:1.55; color:var(--cinza); margin:0 0 18px; }
  a.botao { display:inline-block; background:var(--azul); color:#fff; text-decoration:none; font-weight:600;
            font-size:14px; padding:12px 22px; border-radius:8px; }
  a.botao:hover { background:var(--azul2); }
  small { display:block; margin-top:16px; font-size:12px; color:var(--cinza); }
</style>
</head>
<body>
  <div class="caixa">
    <h1>O AquaControl agora fica dentro do ParHub</h1>
    <p>Turmas, alunos, pagamentos, experimentais e conversas estão todos no mesmo lugar.
       Entre com o seu e-mail e senha do ParHub: a tela <b>Academia</b> abre direto.</p>
    <a class="botao" href="https://app.iaparhub.com.br/">Abrir o sistema novo</a>
    <small>Você será levado automaticamente em 5 segundos.</small>
  </div>
  <script>
    setTimeout(function () { window.location.replace("https://app.iaparhub.com.br/"); }, 5000);
  </script>
</body>
</html>
